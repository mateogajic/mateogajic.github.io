<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mateo Gajić — Ingeniero Físico</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080808;
      --bg2:      #0f0f0f;
      --line:     #222222;
      --text:     #e8e4dc;
      --text2:    #9a9690;
      --accent:   #ff5050;
      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── COMING SOON CONTAINER ── */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      position: relative;
    }

    /* Background grid effect */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.1;
      pointer-events: none;
    }

    /* Content wrapper */
    .content {
      position: relative;
      z-index: 1;
      max-width: 600px;
    }

    /* Logo/Name */
    .logo {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--text2);
      text-transform: uppercase;
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .logo::before {
      content: '';
      display: block;
      width: 2rem;
      height: 1px;
      background: var(--accent);
    }

    .logo span { color: var(--accent); }

    .logo::after {
      content: '';
      display: block;
      width: 2rem;
      height: 1px;
      background: var(--accent);
    }

    /* Main title */
    h1 {
      font-family: var(--font-head);
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    h1 .accent { color: var(--accent); }

    /* Subtitle */
    .subtitle {
      font-size: 1.1rem;
      color: var(--text2);
      margin-bottom: 2rem;
      line-height: 1.7;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Status badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 3rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .status::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Social links */
    .social-links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 3rem;
      flex-wrap: wrap;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--text);
      text-transform: uppercase;
      border: 1px solid var(--line);
      padding: 0.8rem 1.5rem;
      transition: all 0.2s;
    }

    .social-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .social-link .icon { font-size: 1rem; }

    /* Divider */
    .divider {
      width: 60px;
      height: 1px;
      background: var(--accent);
      margin: 2rem auto;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 1.5rem; }
      h1 { font-size: clamp(2rem, 7vw, 3.5rem); }
      .subtitle { font-size: 1rem; }
      .social-links { gap: 1rem; }
      .social-link { padding: 0.7rem 1.2rem; font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="container">
    <div class="content">
      <div class="logo">
        Mateo<span>.</span>Gajić
      </div>

      <h1>
        Coming <span class="accent">Soon</span>
      </h1>

      <p class="subtitle">
        Estoy construyendo mi portafolio. Vuelve pronto para ver mis proyectos, experiencia y trabajos recientes.
      </p>

      <div class="status">
        En construcción
      </div>

      <div class="divider"></div>

      <p style="color: var(--text2); font-size: 0.9rem; margin-bottom: 2rem;">
        Mientras tanto, conéctate conmigo:
      </p>

      <div class="social-links">
        <a href="https://linkedin.com/in/mateo-gajic" target="_blank" class="social-link">
          <span class="icon">in</span> LinkedIn
        </a>
        <a href="https://github.com/mateogajic" target="_blank" class="social-link">
          <span class="icon">⌥</span> GitHub
        </a>
        <a href="mailto:mateogajic@icloud.com" class="social-link">
          <span class="icon">✉</span> Email
        </a>
      </div>
    </div>
  </div>
</body>
</html>
